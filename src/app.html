<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="description" content="AlgoLens - see how algorithms think. A free, in-browser visualiser for sorting, searching, pathfinding and graph algorithms with step-by-step playback, pseudocode and verified results." />
		<meta name="theme-color" content="#FAFAF8" />
		<script>
			// Apply the saved theme before first paint so there is no flash. Guarded so a
			// private-browsing localStorage throw can never break the page.
			(function () {
				try {
					var raw = localStorage.getItem('algolens.settings.v1');
					var theme = raw ? JSON.parse(raw).theme : 'system';
					var dark =
						theme === 'dark' ||
						((!theme || theme === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
